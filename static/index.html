<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Q&amp;A</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1d1f23; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1d1f23; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    .layout { display: flex; flex: 1; min-height: 0; }
    aside { width: 280px; background: #fff; border-right: 1px solid #e2e4e8; padding: 16px; overflow-y: auto; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .drop { border: 2px dashed #c4c8d0; border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 12px; }
    .drop.over { border-color: #3b82f6; background: #eff6ff; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; background: #3b82f6; color: #fff; font-size: 14px; }
    button:disabled { background: #9ca3af; cursor: default; }
    button.ghost { background: transparent; color: #374151; border: 1px solid #d1d5db; }
    .status { font-size: 13px; color: #555; min-height: 18px; margin: 8px 0; }
    ul#docList { list-style: none; padding: 0; margin: 0; }
    ul#docList li { padding: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    ul#docList li:hover { background: #f3f4f6; }
    ul#docList li.active { background: #dbeafe; }
    ul#docList li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .del { background: none; color: #9ca3af; padding: 2px 6px; }
    .del:hover { color: #dc2626; background: none; }
    .tabs { display: flex; gap: 4px; padding: 12px 20px 0; background: #fff; border-bottom: 1px solid #e2e4e8; }
    .tabs button { background: none; color: #6b7280; border-radius: 6px 6px 0 0; border-bottom: 2px solid transparent; }
    .tabs button.active { color: #1d4ed8; border-bottom-color: #1d4ed8; }
    .panel { flex: 1; overflow-y: auto; padding: 20px; min-height: 0; }
    .panel[hidden] { display: none; }
    .doc-meta { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
    pre.doc-text { white-space: pre-wrap; word-wrap: break-word; background: #fff; border: 1px solid #e2e4e8; border-radius: 8px; padding: 16px; font-size: 14px; line-height: 1.5; }
    .msg { margin-bottom: 16px; max-width: 820px; }
    .msg.user { margin-left: auto; background: #dbeafe; padding: 10px 14px; border-radius: 12px; }
    .msg.assistant { background: #fff; border: 1px solid #e2e4e8; padding: 14px; border-radius: 12px; }
    .answer { white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
    .meta { font-size: 12px; color: #6b7280; margin-top: 8px; }
    details { margin-top: 10px; font-size: 13px; }
    details pre { white-space: pre-wrap; background: #f9fafb; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; }
    .web-list a { color: #1d4ed8; }
    form.ask { display: flex; gap: 8px; padding: 12px 20px; background: #fff; border-top: 1px solid #e2e4e8; }
    form.ask input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .empty { margin: auto; color: #6b7280; font-size: 15px; }
    .workspace { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; }
    .toggle { font-size: 14px; display: flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h1>📄 Document Q&amp;A</h1>
    <label class="toggle"><input type="checkbox" id="useWeb" checked> Allow web search</label>
  </header>

  <div class="layout">
    <aside>
      <div class="drop" id="dropZone">
        <p>Drop a file here or</p>
        <input type="file" id="fileInput" accept=".pdf,.txt,.md,.csv,.json">
        <p><button id="uploadBtn" disabled>Upload &amp; index</button></p>
      </div>
      <div class="status" id="uploadStatus"></div>
      <h3>Documents</h3>
      <ul id="docList"></ul>
    </aside>

    <main>
      <div class="placeholder" id="placeholder">
        <div class="empty">Upload a document to get started.</div>
      </div>

      <div class="workspace" id="workspace" hidden>
        <div class="tabs">
          <button data-tab="viewer" class="active">Document</button>
          <button data-tab="chat">Ask questions</button>
        </div>

        <div class="panel" id="viewer">
          <h2 id="docTitle"></h2>
          <div class="doc-meta" id="docMeta"></div>
          <pre class="doc-text" id="docText"></pre>
        </div>

        <div class="panel" id="chat" hidden>
          <div id="messages"></div>
        </div>

        <form class="ask" id="askForm" hidden>
          <input id="question" placeholder="Ask about this document..." autocomplete="off" required>
          <button id="askBtn">Ask</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
